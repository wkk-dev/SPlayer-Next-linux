name: Upstream Sync

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # 每周一 UTC 08:00 执行同步
    - cron: '0 8 * * 1'

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: SPlayer-Dev/SPlayer-Next
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Sync failure notification
        if: failure()
        run: |
          echo "## ⚠️ 上游同步失败 / Upstream Sync Failed"
          echo ""
          echo "The synchronization from upstream repository failed."
          echo "Please check the logs above for details."
          echo ""
          echo "如果 upstream 最近修改了工作流文件，请先在 GitHub 页面手动执行一次 **Sync fork**，"
          echo "确认 Actions 具有读写权限后，再重新运行本工作流。"
        >> $GITHUB_STEP_SUMMARY
