# tag（v*）触发或 commit 描述中包含"构建版本vXX.XX"时自动创建 tag
# 各架构原生 runner 构建 → 合并清单 → 创建 GitHub 草稿 Release
name: Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 22.x

# 同一个 tag 的发布串行执行，避免并发上传资源产生竞态
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 检测 commit 中的版本号并创建 tag
  check-and-create-tag:
    name: Check and Create Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract-version.outputs.tag }}
      should-build: ${{ steps.extract-version.outputs.should-build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from commit message
        id: extract-version
        shell: bash
        run: |
          # 获取最新 commit 信息
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Latest commit message: $COMMIT_MSG"
          
          # 检查是否已经是 tag 触发（refs/tags/v*）
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            TAG="${{ github.ref_name }}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "已是 tag 触发，使用现有 tag: $TAG"
          # 检查 commit 信息中是否包含"构建版本vXX.XX"格式
          elif [[ $COMMIT_MSG =~ 构建版本(v[0-9]+\.[0-9]+(\.[0-9]+)?) ]]; then
            TAG="${BASH_REMATCH[1]}"
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "检测到版本号: $TAG"
            
            # 检查 tag 是否已存在
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG 已存在，将直接使用"
            else
              # 创建并推送 tag
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Auto-release: $TAG from commit $(git rev-parse --short HEAD)"
              git push origin "$TAG"
              echo "已创建并推送 tag: $TAG"
            fi
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
            echo "Commit 中未检测到版本号，跳过构建"
          fi

  # 各平台/架构在对应的原生 runner 上独立构建
  build:
    name: Build on ${{ matrix.name }}
    needs: check-and-create-tag
    if: needs.check-and-create-tag.outputs.should-build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            target: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-and-create-tag.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native/audio-engine -> target\nnative/media-ctrl -> target"

      # 校验 tag 与 package.json 版本一致
      - name: Verify tag matches version
        shell: bash
        run: |
          TAG="${{ needs.check-and-create-tag.outputs.tag }}"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "标签 $TAG 与 package.json 版本 $PKG_VERSION 不一致"
            echo "请确保 package.json 中的版本号与 commit 消息中的版本号匹配"
            exit 1
          fi

      # Linux: 安装系统构建/打包依赖
      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libdbus-1-dev pkg-config clang \
            rpm libarchive-tools

      # 清理旧构建产物
      - name: Clean workspace on macOS & Linux
        if: runner.os != 'Windows'
        run: rm -rf dist out

      # CI 不需要国内镜像
      - name: 移除 .npmrc
        shell: bash
        run: rm -f .npmrc

      # 安装项目依赖
      - name: Install dependencies
        run: pnpm install

      # 仅构建本机架构
      - name: Build ${{ matrix.name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          case "${{ matrix.target }}" in
            linux-x64)
              pnpm build:linux --x64 --publish never
              ;;
            linux-arm64)
              pnpm build:linux --arm64 --publish never
              ;;
            *)
              echo "Unsupported target: ${{ matrix.target }}"
              exit 1
              ;;
          esac

      # 修复 Linux arm64 自动更新清单命名
      # electron-builder 单独构建 arm64 时仍命名为 latest-linux.yml，会与 x64 撞名，
      # 显式重命名为 latest-linux-arm64.yml（electron-updater 在 arm64 上据此查找）
      - name: Rename Linux arm64 update manifest
        if: matrix.target == 'linux-arm64'
        shell: bash
        run: |
          if [ -f dist/latest-linux.yml ]; then
            mv dist/latest-linux.yml dist/latest-linux-arm64.yml
            echo "Renamed latest-linux.yml -> latest-linux-arm64.yml"
          else
            echo "dist/latest-linux.yml not found, skipping"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SPlayer-Next-${{ matrix.name }}
          path: dist/*.*

  # 合并多架构更新清单并创建 GitHub 草稿 Release
  release:
    name: Create GitHub Release
    needs: [build, check-and-create-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-and-create-tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # 整理待发布资源
      - name: Prepare release assets
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/jsyaml" js-yaml@4.1.0
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node .github/scripts/prepare-release-assets.cjs artifacts release-assets
          echo "待发布资源："
          ls -1 release-assets

      # 用官方 gh CLI 确定性创建草稿 Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.check-and-create-tag.outputs.tag }}"
          # 重跑场景：若同名 release 已存在则先删除，避免脏状态（保留 tag）
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --draft \
            release-assets/*
